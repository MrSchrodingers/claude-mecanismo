name: materialize-multiruntime

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-multiruntime-main
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: materializa, valida e publica a arvore definitiva
        env:
          EXPECTED_PATCH_SHA256: 91f331aed2ba716fd25f5c71f9e2dc2281d9a85dd258f3afc00cab93303925ec
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-* > /tmp/source.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/source.patch | sha256sum -c -
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch

          python3 -m pip install --quiet \
            'ruff==0.15.5' \
            'pandas==2.2.3' \
            'openpyxl==3.1.5' \
            'pymupdf==1.27.1' \
            'packaging==25.0' \
            'pyyaml==6.0.2'

          python3 orchestration/render.py
          bash install/manifest.sh install/manifest.lock
          bash scripts/status.sh
          python3 orchestration/render.py --check
          bash tests/unit/runtime-ports.sh
          bash tests/unit/managed.sh
          bash tests/mutation/install.sh
          bash tests/unit/regressao-gate.sh
          bash tests/unit/run.sh

          rm -rf .bootstrap .bootstrap-trigger .github/workflows/materialize-multiruntime.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: estrutura orquestração multirruntime baseada em evidências'
          git push origin HEAD:main
